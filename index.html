<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEV-A Facturatie</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CHEV-A">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --border-color: #c7c7cc;
            --primary-color: #007aff;
            --success-color: #34c759;
            --warning-color: #ff9500;
            --danger-color: #ff3b30;
            --purple-color: #5856d6;
            --info-color: #5ac8fa;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .flex-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .flex-item {
            flex: 1;
            min-width: 250px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }

        input, select, button {
            font-family: inherit;
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            box-sizing: border-box;
            width: 100%;
        }

        input:focus, select:focus {
            outline: 2px solid var(--primary-color);
            border-color: transparent;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
            width: auto;
            padding: 10px 20px;
        }

        button:hover { opacity: 0.9; }
        button:active { opacity: 0.7; }

        .btn-block { width: 100%; margin-top: 10px; }
        .btn-pdf { background-color: var(--success-color); }
        .btn-ubl { background-color: var(--purple-color); }
        .btn-backup { background-color: var(--warning-color); }
        .btn-import { background-color: var(--info-color); color: #1c1c1e; text-align: center; display: inline-block; font-weight: 600; cursor: pointer; padding: 10px 20px; border-radius: 8px; }
        .btn-danger { background-color: var(--danger-color); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e5ea;
        }

        th { background-color: #f2f2f7; font-weight: 600; }

        .total-box {
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            margin-top: 15px;
            line-height: 1.6;
        }

        #importInput { display: none; }
        .logo-container { display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Dashboard / Bedrijf en Klant -->
    <div class="card">
        <div class="logo-container">
            <svg width="150" height="40" viewBox="0 0 150 40" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="30" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#1c1c1e" letter-spacing="-1">CHEV-A</text>
            </svg>
        </div>

        <h2>CHEV-A Facturatiesysteem</h2>
        <p>Factuurnummer: <span id="factuurNr" style="font-weight:bold;">-</span></p>
        
        <div class="flex-group">
            <div class="flex-item">
                <h3>Bedrijfsgegevens</h3>
                <div class="form-group"><input id="bedrijfNaam" placeholder="Bedrijfsnaam"></div>
                <div class="form-group"><input id="bedrijfAdres" placeholder="Adres"></div>
                <div class="form-group"><input id="bedrijfIBAN" placeholder="IBAN"></div>
                <div class="form-group"><input id="bedrijfBTW" placeholder="BTW-nummer"></div>
            </div>
            <div class="flex-item">
                <h3>Klant & Datum</h3>
                <div class="form-group">
                    <label for="klantSelect">Selecteer Klant</label>
                    <select id="klantSelect"></select>
                </div>
                <div class="form-group">
                    <label for="datum">Factuurdatum</label>
                    <input type="date" id="datum">
                </div>
            </div>
        </div>
    </div>

    <!-- Factuur Regels Bouwer -->
    <div class="card">
        <div class="grid-2">
            <div class="form-group">
                <label for="betaling">Betalingstermijn</label>
                <select id="betaling">
                    <option value="14 dagen">14 dagen</option>
                    <option value="30 dagen">30 dagen</option>
                    <option value="Op factuur vermeld">Op factuur vermeld</option>
                </select>
            </div>
            <div class="form-group">
                <label for="factuurReferentie">Referentie / Project</label>
                <input id="factuurReferentie" placeholder="Bijv. Project X">
            </div>
        </div>

        <h3>Factuurregels</h3>
        <div style="overflow-x: auto;">
            <table id="regelsTabel">
                <thead>
                    <tr>
                        <th>Omschrijving</th>
                        <th style="width: 100px;">Aantal</th>
                        <th style="width: 120px;">Prijs (€)</th>
                        <th style="width: 50px;"></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <button type="button" id="btnRegelToevoegen">➕ Regel toevoegen</button>

        <div class="total-box">
            Subtotaal: € <span id="sub">0.00</span><br>
            BTW 21%: € <span id="btw">0.00</span><br>
            Totaal: € <span id="tot">0.00</span>
        </div>
    </div>

    <!-- Actie Knoppen -->
    <div class="flex-group">
        <button type="button" class="btn-pdf" id="btnExportPDF">📄 PDF DOWNLOAD</button>
        <button type="button" class="btn-ubl" id="btnExportUBL">🤖 E-FACTUUR (UBL/XML)</button>
        <button type="button" class="btn-backup" id="btnExportDB">💾 Backup Downloaden</button>
        <label for="importInput" class="btn-import">📂 Import Database</label>
        <input type="file" id="importInput" accept=".json">
    </div>

    <!-- Statistieken & Live Preview -->
    <div class="grid-2">
        <div class="card">
            <h3>Statistieken</h3>
            <p>Jaaromzet: <span id="jaarOmzet" style="font-weight:bold;">€ 0.00</span></p>
            <p id="maandStats"></p>
        </div>
        <div class="card" style="background-color: #fafafa;">
            <h3>Live Preview</h3>
            <div id="previewContent"></div>
        </div>
    </div>

    <!-- Klantenbeheer -->
    <div class="card">
        <h3>Klantenbeheer</h3>
        <div class="grid-2" style="margin-bottom: 15px;">
            <div class="form-group"><input id="kNaam" placeholder="Naam"></div>
            <div class="form-group"><input id="kAdres" placeholder="Adres"></div>
            <div class="form-group"><input id="kContact" placeholder="Contact"></div>
            <div class="form-group"><button type="button" id="btnKlantToevoegen" class="btn-block">Klant Toevoegen</button></div>
        </div>
        <div style="overflow-x
